[package]
name = "novellava"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "novellava"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
dotenv = "0.15.0"
meilisearch-sdk = "0.33.0"
oauth2 = { version = "5.0.0", features = ["default", "reqwest"] }
reqwest = { version = "=0.12.28", features = ["json"] } # Conflcts with oauth2 if reqwest version = 0.13.5
rust-s3 = "0.37.2"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["postgres", "chrono", "uuid", "derive", "runtime-tokio", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tower-sessions = "=0.14.0" # Compatability issue if not 0.14.0 with redis-store
tower-sessions-redis-store = "0.16.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
validator = "0.21.0"
