[package]
name = "water-novel"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "water-novel"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1.0.104"
dotenv = "0.15.0"
meilisearch-sdk = "0.33.0"
oauth2 = { version = "5.0.0", features = ["default", "reqwest"] }
reqwest = { version = "=0.12.28", features = ["json"] } # Conflcts with oauth2 if reqwest version = 0.13.5
serde = { version = "1.0.229", features = ["derive"] }
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tower-sessions = "=0.14.0" # Compatability issue if not 0.14.0 with redis-store
tower-sessions-redis-store = "0.16.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
