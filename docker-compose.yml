services:
  database:
    image: postgres:16-alpine
    container_name: database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis-session:
    image: redis:8.10.0-alpine
    container_name: session-redis
    environment:
      - TZ=UTC
    command: >
      redis-server
      --requirepass ${SESSION_REDIS_PASSWORD}
      --maxmemory ${SESSION_REDIS_MAX_MEMORY}
      --maxmemory-policy ${SESSION_REDIS_MAX_MEMORY_POLICY}
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - session_redis_data:/data

  cache-redis:
    image: redis:8.10.0-alpine
    container_name: redis-cache
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${CACHE_REDIS_PASSWORD}
      --maxmemory ${CACHE_REDIS_MAX_MEMORY}
      --maxmemory-policy ${CACHE_REDIS_MAX_MEMORY_POLICY}
    environment:
      - TZ=UTC
    ports:
      - '6380:6380'
    volumes:
      - cache_redis_data:/data
  meilisearch:
    image: getmeili/meilisearch:v1.53.0
    container_name: meilisearch
    restart: unless-stopped
    ports:
      - '7700:7700'
    environment:
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
    volumes:
      - ./meilisearch_data:/meili_data

volumes:
  pg_data:
  session_redis_data:
  meilisearch_data:
  cache_redis_data:
